name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Apple Silicon: libghostty is built for the host, and the app is arm64-only.
    # macos-26 rather than macos-latest because ghostty's tip wants a current
    # Xcode (Metal toolchain, recent SDK), and pinning keeps an image promotion
    # from moving Xcode under a cached xcframework the key does not cover.
    runs-on: macos-26
    timeout-minutes: 90
    # Only the Release step needs more than read: it creates the release and
    # uploads the zip with the job's own GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Vendor/ghostty is the pin Scripts/libghostty.sh builds from, and
          # --check reads its HEAD even when the artifact comes from the cache.
          submodules: true

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "ghostty pin: $(git -C Vendor/ghostty rev-parse HEAD)"

      - name: Pin
        id: pin
        run: echo "ghostty=$(git -C Vendor/ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # restore/save rather than the combined cache action: its save runs as a
      # post step, which is skipped when the job is cancelled or a later step
      # fails, and that threw away a finished libghostty build once already.
      # Saving right after the build ties the cache to the artifact existing and
      # to nothing else.
      - name: Restore libghostty
        id: libghostty-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/libghostty.version
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ghostty }}

      - name: Restore zig
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Vendor/zig
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ghostty }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-

      # ghostty compiles Metal shaders, and Xcode 26 ships that toolchain as a
      # separate component the runner image does not always carry.
      - name: Metal toolchain
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        run: |
          if xcrun --find metal >/dev/null 2>&1; then
            echo "metal: $(xcrun --find metal)"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build libghostty
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: ./Scripts/libghostty.sh

      - name: Save libghostty
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Vendor/GhosttyKit.xcframework
            Vendor/libghostty.version
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ghostty }}

      - name: Save zig
        if: steps.libghostty-cache.outputs.cache-hit != 'true' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Vendor/zig
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.ghostty }}

      # Says whether what the cache handed us still matches the pin; dev.sh and
      # release.sh run it too and stop if it does not.
      - name: Check libghostty
        run: |
          ./Scripts/libghostty.sh --check
          cat Vendor/libghostty.version

      # The app is built and uploaded before the tests run, so a test that hangs
      # or fails still leaves a downloadable build. The Release step is after
      # them, so a tag's asset is only ever published from a green suite.
      - name: Build app
        timeout-minutes: 20
        run: ./Scripts/release.sh

      # ditto keeps the bundle's symlinks and its ad-hoc signature; `zip` does
      # not, and upload-artifact would re-zip the tree without them either way.
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent .build/release-app/Herdglass.app .build/Herdglass.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Herdglass-${{ github.sha }}
          path: .build/Herdglass.app.zip
          if-no-files-found: error

      # --no-parallel because the suite deadlocks on a 3-core runner: Swift's
      # cooperative pool is one thread per core, `ProcessRunner.run` blocks its
      # caller in `group.wait()` until the drains it queued elsewhere finish,
      # and the three processRunner tests take all three threads, leaving
      # nothing to run the drains. A sample of the wedged process caught exactly
      # that, and 60 serial tests cost under a second anyway. Machines with more
      # cores than blocking tests — this one has 10 — never see it.
      #
      # It stays under a pty because SwiftPM block-buffers into a pipe and the
      # whole suite's output fits in one buffer, so the first hang looked
      # identical to silence; and under a watchdog that samples the stuck
      # process, so the log says where it stopped rather than only that it did.
      - name: Test
        timeout-minutes: 15
        run: |
          script -q /dev/null swift test --filter HerdrClientTests --no-parallel 2>&1 &
          TEST=$!
          (
            sleep 300
            kill -0 "$TEST" 2>/dev/null || exit 0
            echo "::group::swift test is still running after 5m — sampling"
            pgrep -fl 'swiftpm-testing|HerdglassPackageTests|xctest' || true
            for pid in $(pgrep -f 'swiftpm-testing|HerdglassPackageTests|xctest'); do
              /usr/bin/sample "$pid" 3 -file /dev/stdout 2>&1 | head -150 || true
            done
            echo "::endgroup::"
            pkill -9 -f 'swiftpm-testing|HerdglassPackageTests|xctest' || true
            kill -9 "$TEST" 2>/dev/null || true
          ) &
          WATCHDOG=$!
          STATUS=0
          wait "$TEST" || STATUS=$?
          kill "$WATCHDOG" 2>/dev/null || true
          exit "$STATUS"

      # A v* tag publishes the same zip as a Release asset, so a download needs
      # no GitHub login — an Actions artifact does. Re-running a tag's build
      # replaces the asset rather than failing on the existing release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NAME="Herdglass-$TAG-macos-arm64.zip"
          cp .build/Herdglass.app.zip ".build/$NAME"
          GHOSTTY="$(sed -n 's/^ghostty_ref=//p' Vendor/libghostty.version)"
          SHA256="$(shasum -a 256 ".build/$NAME" | cut -d' ' -f1)"

          # Built line by line rather than with a heredoc: this block is indented
          # inside the YAML, and a heredoc would carry that indentation into the
          # notes, where markdown reads ten leading spaces as a code block.
          # An ad-hoc signature is per-machine and carries no notary ticket, so
          # the quarantine step is said here rather than left to Gatekeeper's
          # "damaged and can't be opened".
          {
            echo "Apple Silicon, macOS 14+. Built from \`$GITHUB_SHA\` against ghostty \`$GHOSTTY\`."
            echo
            echo '```bash'
            echo "ditto -x -k $NAME ."
            echo 'xattr -dr com.apple.quarantine Herdglass.app   # ad-hoc signed, not notarized'
            echo 'ditto Herdglass.app /Applications/Herdglass.app'
            echo '```'
            echo
            echo 'Run it from a shell — `/Applications/Herdglass.app/Contents/MacOS/Herdglass` —'
            echo 'for remote hosts: launched from Finder it usually cannot reach `ssh-agent`.'
            echo
            echo "sha256: \`$SHA256\`"
          } > .build/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ".build/$NAME" --clobber
          else
            gh release create "$TAG" ".build/$NAME" --title "$TAG" --notes-file .build/notes.md
          fi
